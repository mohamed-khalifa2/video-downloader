<div class="flex justify-center items-center gap-2 mt-10">
  <!-- Prev -->
  <button
    (click)="handlePage(currentPage() - 1)"
    [disabled]="currentPage() === 1"
    class="px-3 py-1 text-sm border border-gray-700 rounded-lg text-gray-400 hover:text-white hover:border-gray-500 disabled:opacity-30 disabled:cursor-not-allowed transition"
  >
    Prev
  </button>

  <!-- Page Numbers -->
  @for (page of pages(); track $index; let i = $index) {
    <button
      (click)="handlePage(i + 1)"
      class="px-3 py-1 text-sm rounded-lg border transition disabled:cursor-not-allowed"
      [ngClass]="{
        'bg-cyan text-black border-cyan': currentPage() === i + 1,
        'border-gray-700 text-gray-400 hover:text-white hover:border-gray-500':
          currentPage() !== i + 1,
      }"
    >
      {{ i + 1 }}
    </button>
  }

  <!-- Next -->
  <button
    (click)="handlePage(currentPage() + 1)"
    [disabled]="currentPage() === totalPages()"
    class="px-3 py-1 text-sm border border-gray-700 rounded-lg text-gray-400 hover:text-white hover:border-gray-500 disabled:opacity-30 disabled:cursor-not-allowed transition"
  >
    Next
  </button>
</div>
